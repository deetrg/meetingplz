name: ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Write App Store Connect API key
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
      - name: Archive
        run: |
          xcodebuild archive \
            -project MeetingPlz.xcodeproj -scheme MeetingPlz -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MeetingPlz.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MeetingPlz.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER }}"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project MeetingPlz.xcodeproj -scheme MeetingPlz -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: List simulators
        run: xcrun simctl list devices available | grep -i iphone || true
      - name: Capture 6.9 inch (1320x2868)
        run: tools/capture.sh 'iPhone (16|17) Pro Max' shots/6.9 "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/MeetingPlz.app"
      - name: Capture 6.5 inch (1284x2778)
        run: |
          if tools/capture.sh 'iPhone (14 Plus|13 Pro Max|12 Pro Max)' shots/6.5 "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/MeetingPlz.app"; then
            echo "native 6.5 simulator used"
          else
            echo "no 6.5 simulator available; deriving from the 6.9 captures"
            mkdir -p shots/6.5
            for f in shots/6.9/*.png; do
              cp "$f" "shots/6.5/$(basename "$f")"
              sips --resampleWidth 1284 "shots/6.5/$(basename "$f")" >/dev/null
              sips --cropToHeightWidth 2778 1284 "shots/6.5/$(basename "$f")" >/dev/null
            done
          fi
          for f in shots/6.5/*.png; do sips -g pixelWidth -g pixelHeight "$f" | tr '\n' ' '; echo "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/shots/**/*.png
