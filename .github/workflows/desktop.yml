name: desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: v1.0.0
  REQUIRE_SHARED: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          if [ -z "$ID" ]; then
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="MeetingPlz v1.0.0" -f body="MeetingPlz v1.0.0" -F draft=true --jq .id)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "release id $ID"

  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install JS deps
        working-directory: desktop
        run: npm ci
      - name: Generate icons
        working-directory: desktop
        run: npx tauri icon ../shared/art/icon-1024.png
      - name: Build universal app
        working-directory: desktop
        run: npx tauri build --bundles app --target universal-apple-darwin
      - name: Import Developer ID certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"
      - name: Write App Store Connect key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "AUTHKEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          APP="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/MeetingPlz.app"
          BIN=$(ls "$APP"/Contents/MacOS/* | head -1)
          lipo -archs "$BIN"
          codesign --force --deep --options runtime --timestamp --keychain "$KC" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|flags|Authority|TeamIdentifier"
          # notarize the app, staple it, then build + notarize + staple the dmg around it
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/MeetingPlz.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MeetingPlz.zip" --key "$AUTHKEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          STAGE="$RUNNER_TEMP/dmgstage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "MeetingPlz" -srcfolder "$STAGE" -ov -format UDZO MeetingPlz-mac.dmg
          codesign --force --timestamp --keychain "$KC" --sign "$IDENTITY" MeetingPlz-mac.dmg
          xcrun notarytool submit MeetingPlz-mac.dmg --key "$AUTHKEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple MeetingPlz-mac.dmg
          xcrun stapler validate MeetingPlz-mac.dmg
          spctl -a -vv -t open --context context:primary-signature MeetingPlz-mac.dmg || true
          spctl -a -vv -t exec "$APP"
          ls -la MeetingPlz-mac.dmg "$BIN"
      - name: Smoke (demo overlay, best effort)
        continue-on-error: true
        run: |
          APP="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/MeetingPlz.app"
          mkdir -p smoke
          MEETINGPLZ_DEMO=1 "$(ls "$APP"/Contents/MacOS/* | head -1)" > smoke/app.log 2>&1 &
          sleep 14
          screencapture -x smoke/mac-overlay.png || true
          pkill -f "MeetingPlz.app/Contents/MacOS" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingPlz-mac
          path: MeetingPlz-mac.dmg
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash desktop/scripts/upload-asset.sh "${{ needs.release.outputs.id }}" MeetingPlz-mac.dmg MeetingPlz-mac.dmg
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KC" || true
          rm -f "$AUTHKEY"

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install JS deps
        working-directory: desktop
        run: npm ci
      - name: Generate icons
        working-directory: desktop
        run: npx tauri icon ../shared/art/icon-1024.png
      - name: Build NSIS installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - name: Collect installer
        run: |
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe MeetingPlz-windows-setup.exe
          ls -la MeetingPlz-windows-setup.exe desktop/src-tauri/target/release/meetingplz.exe
      - name: Smoke test (demo overlay + screenshot)
        shell: pwsh
        run: ./desktop/scripts/win-smoke.ps1 -Installer "$PWD\MeetingPlz-windows-setup.exe" -OutDir "$PWD\smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-overlay
          path: smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingPlz-windows
          path: MeetingPlz-windows-setup.exe
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash desktop/scripts/upload-asset.sh "${{ needs.release.outputs.id }}" MeetingPlz-windows-setup.exe MeetingPlz-windows-setup.exe
