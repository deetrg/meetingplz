name: MeetingPlz
options:
  bundleIdPrefix: com.dai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4NS83V9Q39
    CODE_SIGN_STYLE: Automatic
targets:
  MeetingPlz:
    type: application
    platform: iOS
    sources:
      - path: MeetingPlz
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dai.meetingplz
        PRODUCT_NAME: MeetingPlz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: MeetingPlz/MeetingPlz.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: MeetingPlz/Info.plist
      properties:
        CFBundleDisplayName: MeetingPlz
        CFBundleName: MeetingPlz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.dai.meetingplz.refresh
        NSAlarmKitUsageDescription: MeetingPlz rings an alarm shortly before your meetings so you never miss one.
        CFBundleURLTypes:
          - CFBundleURLName: com.dai.meetingplz
            CFBundleURLSchemes:
              - meetingplz
